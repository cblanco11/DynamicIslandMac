name: DynamicIsland

options:
  bundleIdPrefix: com.jeffreyotoo
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Full Swift 6 language mode with complete data-race checking.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

    # Ad-hoc local signing. Developer ID + notarization come later.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "NO"

    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

    ALWAYS_SEARCH_USER_PATHS: "NO"
    CLANG_ENABLE_OBJC_ARC: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    DEAD_CODE_STRIPPING: "YES"
    GCC_NO_COMMON_BLOCKS: "YES"
    ENABLE_STRICT_OBJC_MSGSEND: "YES"

targets:
  DynamicIsland:
    type: application
    platform: macOS
    sources:
      - path: Sources/DynamicIsland
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: DynamicIsland
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffreyotoo.DynamicIsland
        INFOPLIST_FILE: Sources/DynamicIsland/Resources/Info.plist
        COMBINE_HIDPI_IMAGES: "YES"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "NO"

schemes:
  DynamicIsland:
    build:
      targets:
        DynamicIsland: all
    run:
      config: Debug
    archive:
      config: Release
